<h1>DragonBall Page</h1>
<hr>

<section class="row">
  <div class="col-12 col-sm-6">
    <h3>agregar:</h3>
    <input type="text" class="formControl" placeholder="Nombre">
    <input type="number" class="formControl mt-2" placeholder="Poder">
  </div>

  <button class="mt-2 btn btn-primary">Agregar</button>

  <div class="col-12 col-sm-6">
    <h3>Listado:</h3>
    <ul>
      @for (character of characters(); track character.id; let idx = $index) {

        @if (character.power > 500) {
          <li>
            <span>{{ idx + 1 }} - {{ character.name }}</span>
            <!-- <strong class="text-danger">({{ character.power }})</strong> -->
            <strong [class.text-danger]="character.power > 9000" [class.text-info]="character.power < 9000">({{ character.power }})</strong>
            <!-- <strong [ngClass]="powerClasses()">({{ character.power }})</strong> -->
          </li>
        } @else {
          <li><strong>aqui va un guerrero de clase baja</strong></li>
        }
      }

    </ul>
  </div>

</section>
