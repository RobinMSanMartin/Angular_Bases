<h3>agregar: {{ name() + '-' + power()}}</h3>
    <input type="text" class="formControl" placeholder="Nombre" [value]="name()" (change)="name.set(txtName.value)" #txtName>
    <input type="number" class="formControl mt-2" placeholder="Poder" [value]="power()" (input)="power.set(txtPower.valueAsNumber)" #txtPower>

    <button class="mt-2 btn btn-primary" (click)="addCharacter()">Agregar</button>
